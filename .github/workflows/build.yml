name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Build and test
        run: ./gradlew clean test build
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: seedcracker-resilient-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
